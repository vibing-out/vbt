# Checks every pull request and every push to main, then deploys to Vercel.
# Pull requests get a preview deployment; main gets production. Nothing deploys on a red build.
# Pattern from Vercel's guide: https://vercel.com/kb/guide/how-can-i-use-github-actions-with-vercel
#
# Repository secrets required:
#   VERCEL_TOKEN       - from vercel.com/account/tokens
#   VERCEL_ORG_ID      - from .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID  - from .vercel/project.json after `vercel link`
#   VERCEL_AUTOMATION_BYPASS_SECRET - Project Settings > Deployment Protection, lets Playwright reach login-protected previews
#   SUPABASE_ACCESS_TOKEN - supabase.com/dashboard/account/tokens; applies migrations on merge to main
#   SUPABASE_DB_PASSWORD  - the production database password
#   SUPABASE_PROJECT_ID   - the project reference string
# Migrations deploy from CI only, per Supabase's guide: https://supabase.com/docs/guides/deployment/managing-environments

name: CI and Deploy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
  PROD_FLAG: ${{ github.event_name == 'push' && '--prod' || '' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Production only: apply database migrations before the app that depends on them deploys.
      - uses: supabase/setup-cli@v1
        if: github.event_name == 'push'
        with:
          version: 2.122.1
      - if: github.event_name == 'push'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --yes --remote
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=$VERCEL_ENV --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build $PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }}
      - id: deploy
        run: echo "url=$(vercel deploy --prebuilt $PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
      - run: echo "Deployed to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          BASE_URL: ${{ needs.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
