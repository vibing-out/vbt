# Checks every pull request and every push to main, and applies database migrations on push to main.
# Deploys come from Vercel's Git integration: pull requests get a preview deployment, main gets production.
#
# Repository secrets required (migrations only):
#   SUPABASE_DB_PASSWORD  - the production database password
#   SUPABASE_PROJECT_ID   - the project reference string
# Migrations connect through the project's session pooler (IPv4, which GitHub runners need) with the
# database password, so no person's Supabase access token is stored in CI.
# Migrations deploy from CI only, per Supabase's guide: https://supabase.com/docs/guides/deployment/managing-environments

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Runs `check` on a branch's latest commit. dispatch.ts landed starts it on epic/<n> when marking it ready,
  # since a merge made with GITHUB_TOKEN starts no workflow, so the required check still runs.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  migrate:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          POOLER_HOST: aws-0-us-east-2.pooler.supabase.com
        run: |
          if [ ! -d supabase/migrations ]; then
            echo "No supabase/migrations yet (T-04 adds them); nothing to apply." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          supabase db push --yes --db-url "postgresql://postgres.${SUPABASE_PROJECT_ID}:${SUPABASE_DB_PASSWORD}@${POOLER_HOST}:5432/postgres"
