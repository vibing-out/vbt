# The factory's deterministic routing: each job runs one subcommand of scripts/factory/dispatch.ts.
#   check          a ticket gets `queued`: post earlier context, then label factory-ready (Warp's trigger) or blocked
#   landed         a pull request merges into epic/*: log its context-log block, close the ticket, re-check what it blocked,
#                  and once the epic's last ticket closes, update the epic pull request from main and mark it ready;
#                  into main: log its context-log block only (setup work and epic roll-ups)
#   unblock        an issue closes: re-check the blocked issues it held back (for an epic, those waiting on any of its tickets)
#   context-check  a pull request into epic/* or main opens or changes: its body needs one valid context-log block
#                  (a required check), and an epic/* one also needs one `Ticket: #n` line; `landed` also dispatches it
#                  (workflow_dispatch, input `pr`) after updating an epic branch, since that push starts no workflow
#   notify         an issue gets `needs-human` (from a person or Warp's GitHub app): post it to the team Slack channel.
#                  `landed` adds `needs-human` with GITHUB_TOKEN, which starts no workflow, so it posts in-process.
#
# Repository secrets required (the factory-dispatch identity in the context log, see the vbt-context README):
#   CONTEXT_SUPABASE_URL, CONTEXT_SUPABASE_PUBLISHABLE_KEY, CONTEXT_EMAIL, CONTEXT_PASSWORD
# Optional: SLACK_WEBHOOK_URL, the team channel's Slack incoming webhook. Without it, notify logs and skips.
#
# Safety: only issue and pull request numbers reach `run:`, through env; titles and bodies are read by the
# script from the API. Every job checks out the default branch, so a pull request can't change the script
# that judges it. `pull_request_target` is never used.

name: Factory

on:
  issues:
    types: [labeled, closed]
  pull_request:
    types: [opened, edited, synchronize, closed]
    branches: ['epic/**', 'main']
  # Runs only `context-check`, for the pull request whose head is the dispatched branch. dispatch.ts landed
  # starts it on epic/<n> after updating that branch with GITHUB_TOKEN, a push that starts no workflow.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to check
        required: true
        type: number

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  dispatch-check:
    if: github.event_name == 'issues' && github.event.label.name == 'queued'
    # Per job, not per workflow: a workflow-level group would let an unrelated label event cancel a pending check.
    concurrency:
      group: factory-${{ github.event.issue.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          SUPABASE_URL: ${{ secrets.CONTEXT_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CONTEXT_SUPABASE_PUBLISHABLE_KEY }}
          CONTEXT_EMAIL: ${{ secrets.CONTEXT_EMAIL }}
          CONTEXT_PASSWORD: ${{ secrets.CONTEXT_PASSWORD }}
        run: node scripts/factory/dispatch.ts check "$ISSUE"

  landed:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged
    concurrency:
      group: factory-landed-${{ github.event.pull_request.number }}
    # Writes beyond the workflow default, for the epic pull request once its last ticket lands:
    # contents to merge main into epic/<n> (update-branch), pull-requests to mark it ready for review,
    # actions to dispatch ci.yml and factory.yml on the updated branch so its required checks run.
    permissions:
      issues: write
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SUPABASE_URL: ${{ secrets.CONTEXT_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CONTEXT_SUPABASE_PUBLISHABLE_KEY }}
          CONTEXT_EMAIL: ${{ secrets.CONTEXT_EMAIL }}
          CONTEXT_PASSWORD: ${{ secrets.CONTEXT_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/factory/dispatch.ts landed "$PR"

  unblock:
    # Closes made by GITHUB_TOKEN don't start workflows, so `landed` unblocks in-process; this covers the rest,
    # chiefly an epic closing when its epic pull request merges into main.
    if: github.event_name == 'issues' && github.event.action == 'closed'
    concurrency:
      group: factory-unblock-${{ github.event.issue.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          SUPABASE_URL: ${{ secrets.CONTEXT_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CONTEXT_SUPABASE_PUBLISHABLE_KEY }}
          CONTEXT_EMAIL: ${{ secrets.CONTEXT_EMAIL }}
          CONTEXT_PASSWORD: ${{ secrets.CONTEXT_PASSWORD }}
        run: node scripts/factory/dispatch.ts unblock "$ISSUE"

  context-check:
    if: (github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.pull_request.number }}
        run: node scripts/factory/dispatch.ts context-check "$PR"

  notify:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'needs-human'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/factory/dispatch.ts notify "$ISSUE"
